apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-server
  namespace: react-golang-chat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - chat-api.martishin.com
      secretName: chat-server-tls
  rules:
    - host: chat-api.martishin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat-server
                port:
                  number: 80
